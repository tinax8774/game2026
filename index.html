        <style>
            /* CSS */
            @import url('https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');

            h1 {
                background: #ffffff;
                text-decoration-line: underline !important;
                text-decoration-line: underline;
                text-decoration-color: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet) !important;
                text-decoration-color: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);

                text-decoration-style: wavy;

                border-radius: 25px;

        <title>AP Chemistry Review Game</title>
    </head>
    <body>
        <!-- HTML -->

        <h1>
            <span style="text-decoration: underline wavy #63D2FF;">
                Welcome,
                <span id="name-placeholder"></span>!
            </span>
            <span style="text-decoration: underline wavy #63D2FF;">
                To AP Chemistry Review!</span>
        </h1>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
        <script src="//cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
        <!-- <script src="script.js"></script> -->
        <script>
            // JS
            var name = prompt("What's your name?");
            var welcomeMessage = alert("Welcome " + name + "! " + "To This AP Chemistry Review Game!");
            var namePlaceholder = document.getElementById('name-placeholder');
            namePlaceholder.textContent = name;

            var unitOne = [
            {
                question: "How many moles of calcium carbonate (CaCO_2) are present in 200.0g of the compound",

                options: [
                    "(a)1.00 mol",
                    "(b)2.00 mol", 
                    "(c)2.50 mol", 
                    "(d)5.00 mol"
                ],

                correct_answer: "(b)2.00 mol",

                explanation: "To calculate moles, divide the mass by the molar mass. Calcium carbonate ahs a molar mass of approximately 100.1 g/mol (40.1+12.0+3*16.0). 200.0g/100.1 g/mol=2.00 mol."
            },

            {
                question: "A sample contains 75% of an isotope with mass 10 amu and 25% of an isotope with mass 11 amu. What is the average atomic mass?", 

                options: [
                    "(a)10.25 amu", 
                    "(b)10.50 amu", 
                    "(c)10.75 amu", 
                    "(d)11.00 amu"
                ],

                correct_answer: "(a)10.25 amu", 

                explanation: "Average atomic mass is calculated using a weighted average, not a siple mean. Each isotope's mass is multiplied byb its fractional abundance. (10*0.75)+(11*0.25)=7.50+2.75=10.25 amu. This reflects the fact that the lighter isotope is more abundant, pulling the average closer to its mass."
            },
            
            {
                question: "One mole of carbon-12 contains how many atoms?",

                options: [
                    "(a)6.02*10^22", 
                    "(b)6.02*10^23", 
                    "(c)12.0*10^23", 
                    "(d)1.0*10^23"
                ],

                correct_answer: "(b)6.02*10^23", 

                explanation: "Avogadro's number, 6.02*10^23 particles per mole, defines the mole. By definition, one mole of carbon-12 contians exactly this amount of atoms. This value provides teh bridge between atomic-scale quantities and laboratory-scale measurements and is essential for all mole calculations in chemistry",   
            },

            {
                question: "Which sample contains the greatest amount of atoms", 

                options: [
                    "(a)1 mol of He", 
                    "(b)1 mol of Ne", 
                    "(c)1 mole of Ar", 
                    "(d)All contain the same number"
                ],

                correct_answer: "(d)", 

                explanation: "One mole of any substnace contains the same number of particles. Avogradro's number. Even though helium, neon and argon have different atomic masses, one mole of each contains 6.022*10^23 atoms. This highlights the importance of distinguishing between mass and number of particles", 
            },

            {
                question: "How many moles are present in 36.0g of water (H_2O)", 

                options: [
                    "(a)1.0 mol", 
                    "(b)2.0 mol", 
                    "(c)18.0 mol", 
                    "(d)0.50 mol"
                ],

                correct_answer: "(b)2.0 mol",

                explanation: "The molar mass is aproximately 18.0 g/mol. Dividing the given mass by the molar mass gives: 36.0 g/ 18.0 g/mol=2.0 mol."
            },

            {
                question: "Which particle contributes most to an atom's volume", 

                options: [
                    "(a)Proton", 
                    "(b)Neutron",
                    "(c)Electron Cloud", 
                    "(d)Nucleus", 
                ],

                correct_answer: "(c)Electron Cloud",

                explanation: "Although the nucleus contains neaerly all of an atom's mass, it occupies very little space. The electron cloud extends far from the nucleus and defines the atom's size and volume. This explains why atoms are mostly empty space and why electron interactions dominate chemical reactions."
            },

            {
                question: "A neutral atom has 17 protons. How many electrons does it contain", 

                options: [
                    "(a)16", 
                    "(b)17", 
                    "(c)18",
                    "(d)Cannot be determined"
                ],

                correct_answer: "(b)17", 

                explanation: "In a neutral atom, the number of electrons equals the number of protons so that postitive and negative charges balance. With 17 protons, the atom must also have 17 electrons. THis principle is essential for understanding ion formation later in the course."
            },

            {
                question: "Which best describes the relationship between atomic mass and molar mass", 

                options: [
                    "(a)They are unrelated", 
                    "(b)Atomic mass is larger", 
                    "(c)Molar mass is atomic mass in grams", 
                    "(d)Molar mass applies only to compounds"
                ],

                correct_answer: "(c)Molar mass is atomic mass in grams", 

                explanation: "Atomic mass is expressed in aotmic mass units for individual atoms, while molar mass represents the mass of one mole of those atoms in grams. Numerically, the values are the same. This relationship allows seamless conversion between atomic-scale and  macroscopic quantities."
            },

            {
                question: "How many atoms are in 0.25 mol of neon?", 

                options: [
                    "(a)1.51*10^23", 
                    "(b)6.02*10^23",
                    "(c)2.41*10^23", 
                    "(d)0.25 atoms"
                ],

                correct_answer: "(a)1.51*10^23", 

                explanation: "To find the number of atoms, multiply the number of moles by Avogradro's number. 0.25 mol * 6.02*10^23 atoms/mol=1.51*10^23 atoms."
            },

            {
                question: "Which statement best distinguishes a pure substance from a mixture?", 

                options: [
                    "(a)A pure substance contains only one element", 
                    "(b)A pure substance has fixed composition",
                    "(c)A mixture has a chemical formula",
                    "(d)A mixture cannot be seperated"
                ],

                correct_answer: "(b)A pure substance has fixed composition", 

                explanation: "A pure substance (element or compound) has a fixed, constant composition and a definite set of properties. Mixture, in contrast, can have variable composition depending on how much of each component is present. Elements are not the only pure substances-compounds are also pure if their composition is fixed."
            },

            {
                question: "A compound is 52.2% carbon, 13.0% hydrogen, and 34.8% oxygen by mass. What is the first step in determining the emprical formula", 

                options: [
                    "(a)Divide each percentage by atomic mass", 
                    "(b)Assume 10 g of the compound", 
                    "(c)Round percentages", 
                    "(d)Calculate molar mass"
                ],

                correct_answer: "(b)Assume 10 g of the compound", 

                explanation: "Assuming a 100 g sample allows percent values to be treated directly as grams, simplifying conversion to moles."
            }, 

            {
                question: "What fundamental information does photoelectron spectrosopy provide about an atom", 

                options: [
                    "(a)Atomic mass and isotope ratios", 
                    "(b)Electron binding energies and subshell occupancy", 
                    "(c)Molecular geometry", 
                    "(d)Nuclear Stability"
                ],

                correct_answer: "(b)Electron binding energies and subshell occupancy", 

                explanation: "PES measures the energy required to remove electrons from an atom. Each peak corresponds to electrons in specific subshell, and the peak position reflects binding energy while peak area reflects the number of electrons present. This directly links PES to electron configuration and relative orbital energies."
            },

            {
                question: "Which trends explains why atomic radius decreases across a period", 

                options: [
                    "(a)Increasing shielding", 
                    "(b)Incrasing principal energy level", 
                    "(c)Increasing effective nuclear charge", 
                    "(d)Increasing number of orbitals"
                ],

                correct_answer: "(c)Increasing effective nuclear charge", 

                explanation: "Across a period, protons are added to the nucleus while electrons are added to the same principal energy level. Shielding changes very little, so Zff increases, pulling electrons closer and shrinking atomic radius."
            }
        ];
        </script>
    </body>
</html>
