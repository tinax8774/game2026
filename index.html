           var unitOneExplanations = [
               "To calculate moles, divide the mass by the molar mass. Calcium carbonate has a molar mass of approximately 100.1 g/mol (40.1+12.0+3*16.0). 200.0g / 100.1 g/mol = 2.00 mol.",
               "Average atomic mass is calculated using a weighted average, not a simple mean. Each isotope's mass is multiplied by its fractional abundance: (10 * 0.75) + (11 * 0.25) = 7.50 + 2.75 = 10.25 amu. This reflects the fact that the lighter isotope is more abundant, pulling the average closer to its mass.",
               "Avogadro's number, 6.02*10^23 particles per mole, defines the mole. By definition, one mole of carbon-12 contains exactly this amount of atoms. This value provides the bridge between atomic-scale quantities and laboratory-scale measurements and is essential for all mole calculations in chemistry.",
               "One mole of any substance contains the same number of particles (Avogadro's number). Even though helium, neon, and argon have different atomic masses, one mole of each contains 6.022*10^23 atoms. This highlights the importance of distinguishing between mass and number of particles.",
               "The molar mass is approximately 18.0 g/mol. Dividing the given mass by the molar mass gives: 36.0 g / 18.0 g/mol = 2.0 mol.",
               "Although the nucleus contains nearly all of an atom's mass, it occupies very little space. The electron cloud extends far from the nucleus and defines the atom's size and volume. This explains why atoms are mostly empty space and why electron interactions dominate chemical reactions.",
               "In a neutral atom, the number of electrons equals the number of protons so that positive and negative charges balance. With 17 protons, the atom must also have 17 electrons. This principle is essential for understanding ion formation later in the course.",

               "A pure substance (element or compound) has a fixed, constant composition and a definite set of properties. A mixture, in contrast, can have a variable composition depending on how much of each component is present. Elements are not the only pure substances—compounds are also pure if their composition is fixed.",
               "Assuming a 100 g sample allows percent values to be treated directly as grams, simplifying conversion to moles.",
               "PES measures the energy required to remove electrons from an atom. Each peak corresponds to electrons in a specific subshell; the peak position reflects binding energy, while the peak area reflects the number of electrons present.",
               "Chlorine (Cl) and Sulfur (S) are in the same period (row 3). Moving left to right across a period, the number of protons (nuclear charge) increases while the electron shielding remains relatively constant. This higher effective nuclear charge pulls the valence electrons closer to the nucleus, making the atomic radius of Cl smaller than that of S.",
               "Bromine has the highest electronegativity because it is a nonmetal located toward the top right of the periodic table. Atoms in this region have a strong pull on electrons because they have a high effective nuclear charge and few electron shells, meaning they strongly attract shared electrons in a chemical bond.",
               "Cesuim (Cs) has the largest atomic radius because it sits furthest down and to the left on the periodic table. Atomic size increases down groups as new electron shells are added, and decreases from left to right as a stronger nuclear charge pulls electrons inward. While Cs and lead (Pb) both have six electron shells- making them larger than silver (Ag) and bromine (Br)-Cs has far fewer protons have Pb. THis weaker nuclear pull allows the outermost electrons of cs to expand further outward, giving it the largest radius.",
               "Cesium has the largest atomic radius because it is located at the bottom left of the periodic table. Elements in this region have the highest number of occupied electron shells combined with a relatively low number of protons in the nucleus. This causes the outermost electrons to sit very far away from the center of the atom.",
               "These are all transition metals located in the middle of the fourth row. As you move across this row, electrons are added to an inner shell rather than the outermost shell. These inner electrons shield the outer electrons very effectively, which keeps the overall size of the atoms nearly identical. The other options involve elements from main groups where sizes change dramatically between rows and columns.",
               "When forty-four grams of carbon dioxide is produced, it contains exactly one mole of carbon atoms. When forty-five grams of water is produced, it contains exactly five moles of hydrogen atoms. This sets up a strict carbon to hydrogen ratio of one to five.",
               "Converting the given mass to moles yields 1 mole of carbon from the 12 grams, 3 moles of hydrogen from the 3 grams, and half a mole of oxygen from the 8 grams. To find the simplest whole number ratio, you divide all of these values by the smallest number, which is half a mole. This doubles the value to give 2 carbons, 6 oxygen, resulting in the empirical formula C_2H_5O.",
               "Converting 3.21 grams of sulfur to moles gives roughly 0.1 moles. Converting eleven 11.4 g of fluorine to moles gives roughly 0.6 moles. Dividing both values of 0.1 shows that there are six fluorine atoms for each one sulfur atom, giving the formula SF_6.",
               "For the 100 gram sample of the oxide, 48 grams of oxygen and 52 grams of chromium. Dividing 48 grams of oxygen by its molar mass it gives exactly 3 moles of oxygen. Dividing 52 grams of chromium gives exactly 1 mole of chromium. This leaves a one to three ratio, making the formula CrO_3.",
               "The student calculated a water loss of 38% instead of the true value of 51%, meaning they measured less weight loss than expected. If the dry sample is allowed to sit out uncovered after heating, it will absorb moisture from the surrounding air. This increases the final weight of the sample and makes it appear as though less water evaporated during the experiment.",
               "Silicon has 4 valence electrons. When a phosphorous atom replaces a silicon atom in the crystal structure, it brings five valence electrons. Four of those electrons form bonds with the surrounding silicon network, leaving the fifth electron entirely unbonded. This free electron acts as a mobile negative charge that can move through the crystal, which dramatically increases the overall conductivity of the material and creates an n-type semiconductor.",
               "To find the total mass of the potassium chlorate sample, you first determine the number of moles of chlorine atoms present. The atomic mass of chlorine is approximately 35.5 grams per mole, so dividing 71 grams by 35.5 gives exactly 2 moles of chlorine atoms. Because each formula unit of KClO_3 contains exactly one chlorine atom, having exactly 2 moles of the entire KClO_3 compound. Next, you calculate the molar mass of KClO_3 by adding the atomic masses of one potassium atom, one chlorine atom, and three oxygen atoms, which totals roughly 122.6 grams per mole. Finally, multiplying those 122.6 grams by the 2 moles gives a total sample mass of 245 grams.",
               "Distillation is a laboratory technique used to separate a mixture of liquids based on differences in their boiling points. When the mixture is heated, the liquid with the lower boiling point vaporizes first. This vapor then passes through a cooling condenser, where it turns back into a liquid and is collected in a separate container.",
               "Aluminum has thirteen total electrons, giving it a ground-state election configuration of 1s2 2s2 2p6 3s2 3p1. The valence electrons are those located in the outermost shell, where the principal quantum number n equals 3. Among these valence electrons in the 3s subshell. For a p subshell, the angular momentum quantum number l must equal 1. Therefore, the highest energy valence electron must have n equals to 3 and l equal to 1.",
               "The molecule C_2H_6 contains a carbon-carbon single bond, while the molecule C_2H_2 contains a carbon-carbon triple bond. A triple bond shares more electrons between the two carbon atoms than a single bond does. This extra electron sharing creates a much stronger electrostatic pull between the nuclei, which draws the carbon atoms closer together and makes the bond length shorter. Because a triple bond is much tighter and stronger, it also requires significantly more energy to break, meaning its bond energy is much greater. Therefore, C_2H_2 will have a greater bond energy and a shorter bond length than C_2H_6.",
               "In the sulfite reactant, SO_3 2-, sulfur has an oxidation number of positive 4. In the sulfate product, SO_4 2-, sulfur goes up to an oxidation number of positive 6. Because its oxidation number increased, sulfur lost electrons and was oxidized. The substance that undergoes oxidation always acts as the reducing agent for the rest of the reaction. Therefore, the sulfite ion is the reducing agent.",
               "A substance that can act as both a Bronsted-Lowry acid and a Bronsted-Lowry base is called amphiprotic. To act as an acid, a substance must be able to donate a hydrogen ion. To act as a base, a substance must be able to accept a hydrogen ion. THe hydrogen sulfate ion, HSO_4-, can do both. It can donate its remaining hydrogen ion to become a sulfate ion, SO_4 2-, or it can accept a hydrogen ion to become sulfuric acid, N_2SO_4.",
               "Chlorine and argon are located in the same period of the periodic table. As you move from left to right across a period, the number of protons in the nucleus increases while the amount of inner-core electron shielding remains the same. Because argon has eighteen protons compared to chlorine's seventeen, its valence electrons experience a higher effective nuclear charge. THis stronger positive charge exerts a tighter electrostatic pull on the outer electrons, making it require more energy to remove an electron from argon.",
               "The student found that the impure sample has a chlorine mass percent of 75 percent, which is higher than the 61 percent found in pure sodium chloride. This means the impurity must be a compound that contains a higher mass percentage of chlorine than sodium chloride does. To increase the overall chlorine mass percent, the non-chlorine part of the impurity must have a smaller molar mass than sodium. From the options, lithium has a much smaller atomic mass than sodium, which makes the chlorine make up a larger percentage of the total mass in lithium chloride. Potassium and iodine are heavier than sodium, which would decrease the total percentage of chlorine in the sample. Therefore, lithium chloride is the only impurity that would raise the chlorine mass percent to 75 percent.",
               "The chemist found that the impure sample has a carbon mass percent of 38.2 percent, which is lower than the 40.0 percent found in pure glucose. This means the impurity must either contain no carbon at all, or contain  a lower mass percentage of carbon than glucose does, thereby diluting the overall carbon content. Water contains zero percent carbon by mass, so its presence as an impurity would directly lower the total mass percent of carbon in the mixture.",

        var unitFourExplanation = [
            "A synthesis reaction occurs when two or more simpler substances combine to form a single compound. In option B, elemental potassium and chlorine react to form potassium chloride, a single product. Choice A is decomposition, C is single replacement, and D is double replacement (acid-base). Recognizing the number of reactants versus products is critical for correct classification.",

            "Double-replacement reactions involve two ionic compounds, usually aqueous, exchanging ions to form two new compounds. This category includes precipitation, acid-base, and gas-forming reactions. The other reaction types do not involve ion exchange between two compounds.",

            "The theoretical yield is the maximum amount of product that can form if the reaction goes perfectly according to stoichiometry and the limiting reactant is completely consumed. It is calculated, not measured, and serves as a benchmark for evaluating experimental efficiency.",

        var unitFiveExplanation = [
            "At equilibrium, a reversible reaction does not stop. Instead, the forward reaction (reactant forming products) and the reverse reaction(products reforming reactants) continue simultaneously at equal rates. This valence causes concentrations to remain constant over time, but not necessarily equal. This misconception that reactions 'stop' at equilibrium is common but incorrect.",
            "Dynamic equilibrium means that reactions are still occurring at the molecular level. Particles continue to collide, break bonds and form new ones. The key features is that these processes happen at equal rates in both directions.Therefore, although macroscopic properties remain constant, microscopic activity never stop.",
            "The Haber process involves nitrogen and hydrogen reacting to form ammonia, and ammonia decomposing back into nitrogen and hydrogen. Both forward and reverse reactions occur under controlled conditions. Combustion and rusting proceed essentially to completion and are not reversible under normal conditions.",
            "The equilibrium constant provides information about the relative concentrations of products and reactants at equilibrium, not how fast equilibrium is reached. Reaction speed is determined by kinetics, while K reflects thermodynamic favorability. A large K indicates product-favored equilibrium, while a small K indicates reactant-favored equilibrium.",
            "The value of K depends only on temperature for a given reaction. Changes in concentration, pressure, or volume may shift equilibrium position but do not change K.",
            "In a Kc expression, product concentrations are placed in the numerator and reactant concentrations in the denominator. Each concentration is raised to the power of its stoichiometric coefficient. SInce one mole of N_2O_4 forms from two moles of NO_2, the correct expression is [N_2O_4]/[NO_2]^2.",
            "The equilibrium constant is defined as a ratio of product concentrations to reactant concentrations, each raised to their stoichiometric coefficients, evaluated at equilibrium. It does not describe how fast equilibrium is reached, nor how much reactant was initially present. Instead, it reflects the relative stability of products compared to reactants under given temperature conditions.",
            "ICE tables organize information about Initial, Change, and equilibrium concentration. They help the student system move toward equilibrium. While K gives a ratio at equilibrium, ICE tables connect that ratio to actual concentration changes, making them essential for conceptual and quantitative equilibrium reasoning.",
            "ICE tables help organize Initial, Change, and Equilibrium concentrations so that stoichiometry and equilibrium expressions are applied consistently. They do not replace algebra, but they prevent conceptual errors by forcing students to think about reaction direction, magnitude of change, and stoichiometric relationships before plugging values into equations.",
            "If no products are present initially, the reaction quotient Q equals zero. Since equilibrium constants are always positive, Q>K, meaning the reaction must proceed forward to form products. Recognizing this saves time and ensures the correct sign is chosen in the ICE table.",
            "Le Chatelier's principle describes how a system at equilibrium responds when disturbed. The system shifts in the direction that reduces the applied stress,such as changes in concentration, pressure, or temperature. Importantly, the equilibrium constant does not change unless temperature changes-only the equilibrium position shifts.",
            "The correct logical sequence is to compare Q and K first to determine the direction of shift, then set up the ICE table, solve for equilibrium) concentrations, and finally validate assumptions. Skipping steps often leads to incorrect signs for x or unphysical results like negative concentrations.",
            "The reaction quotient Q, is calculated using the same form as the equilibrium constant, but with current (not necessarily equilibrium concentrations or partial pressures. It can be evaluated at any moment to determine whether a system is at equilibrium and , if not, which direction it will shift to reach equilibrium. Q does to describe the reaction rate.",
            "Q and K are written using the same mathematical expression, with products over reactants raised to their stoichiometric coefficients. The difference lies in the values substituted: Q uses current conditions, while K uses equilibrium conditions. This similarity allows direct comparison between Q and K.",
            "When Q equals K, the system is at equilibrium. Forward and reverse reaction rates are equal, so concentrations remain constant over time. The reaction has not stopped - dynamic equilibrium still exists at the particulate level.",
            "Adding a reactant instantly changes the denominator of the Q expression, so Q changes immediately, before any shift occurs. The system then responds by shifting until Q equals K again. A common trap is thinking the shift happens first - Q always changes first, then the system reacts.",
            "Adding reactant increases its concentration, making Q < K. The system responds by shifting in the forward direction to reduce the added stress. Importantly, the equilibrium constant does not change-only the equilibrium position changes.",
            "Increasing pressure compresses the system. The equilibrium shifts toward the side with fewer moles of gas, because that side occupies less volume and reduces pressure. Solids and liquids do not affect this reasoning.",
            "In an endothermic reaction, heat acts like a reactant. Adding heat (increasing temperature) shifts equilibrium toward products to consume the added heat.",
            "Remembering that only temperature changes the equilibrium constant prevents the most common AP chemistry errors and traps",
            "Doubling reactant concentration increases Q, making the system no longer at equilibrium. The system responds by shifting in the direction that consumes the added reactant, restoring Q to K. The equilibrium constant itself remains unchanged because temperature did not change.",
            "Energy diagrams show the relative potential energies of reactants, products, and the transition state for both forward and reverse reactions. They help visualize energy changes but do not directly show rates or equilibrium constants.",
            "Lower-energy products indicate a thermodynamically favorable reaction. This corresponds to a negative ΔH, meaning the reaction favors products at equilibrium and K is greater than 1.",
            "When ΔG equals zero, the system is at equilibrium under standard conditions. Reactants and products are equally favored, and K equals 1.",
            "Kp is written using partial pressures of gaseous species, while Kc uses molar concentrations. Both describe the same equilibrium position at a given temperature, but they use different measures of amount. Catalysts do not change either constant.",
            "A flat (constant) concentration indicates that the rates of the forward and reverse reactions are equal. The reaction has not stopped-particles continue reacting-but concentrations no longer change.",
            "A vertical jump indicates an instantaneous change in concentration, which occurs when a substance is added or removed. Shifts caused by temperature or pressure changes occur gradually, not instantaneously.",
