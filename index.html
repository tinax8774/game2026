                "To calculate moles, divide the mass by the molar mass. Calcium carbonate has a molar mass of approximately 100.1 g/mol (40.1+12.0+3*16.0). 200.0g / 100.1 g/mol = 2.00 mol.",

            "Sodium chloride forms an extended ionic lattice where each Na+ ion is surrounded by Cl- ions and vice versa. The strong electrostatic attractions between oppositely charged ions require a large amount of energy to overcome, resulting in a high melting point. Water, by contrast, consists of discrete molecules held together by hydrogen bonding, which is significantly weaker than ionic attractions.",

            "Ammonia exhibits hydrogen bonding because hydrogen is bonded to a highly electronegative nitrogen atom. Hydrogen bonding is stronger than dipole-dipole forces and London dispersion forces. CH_4 and CO_2 are nonpolar, and H_2S lacks the electronegatively required for hydrogen bonding, making NH_3 the strongest.",
